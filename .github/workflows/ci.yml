name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Lint, types, Jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npm run i18n:check

  swift:
    name: Swift keyboard core (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - run: swift test --package-path targets/keyboard

  android-ime:
    name: Android IME core (Gradle unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Gradle unit tests
        working-directory: modules/replywise-ime/android
        run: ./gradlew testDebugUnitTest --no-daemon
