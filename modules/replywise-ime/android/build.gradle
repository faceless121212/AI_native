// Built two ways:
// 1. Inside the app: Expo autolinking includes this folder as project ':replywise-ime'.
//    expo-module-gradle-plugin then sets compileSdk, minSdk, Kotlin and the expo-modules-core
//    dependency from the app, exactly like any other local Expo module.
// 2. Standalone root project (settings.gradle in this folder):
//      cd modules/replywise-ime/android && ./gradlew testDebugUnitTest
//    Used by CI and for quick JVM unit tests without prebuild. AGP/Kotlin versions are pinned here
//    and must stay in sync with the app (node_modules/react-native/gradle/libs.versions.toml).
buildscript {
  if (project == rootProject) {
    repositories {
      google()
      mavenCentral()
      // Fallback mirror of Maven Central: CI has seen Central throttle or fail to resolve
      // artifacts that exist (kotlin-stdlib, commons-io), which broke the standalone build.
      gradlePluginPortal()
    }
    dependencies {
      classpath 'com.android.tools.build:gradle:9.2.1'
      classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.0'
    }
  }
}

def isStandalone = (project == rootProject)

apply plugin: 'com.android.library'

if (isStandalone) {
  // Same as the app (android.builtInKotlin=false in gradle.properties): classic Kotlin plugin.
  apply plugin: 'org.jetbrains.kotlin.android'
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
  }
} else {
  apply plugin: 'expo-module-gradle-plugin'
}

group = 'app.replywise.ime'
version = '0.1.0'

android {
  namespace = "app.replywise.ime"

  if (isStandalone) {
    compileSdk = 37
    defaultConfig {
      minSdk = 24
    }
    compileOptions {
      sourceCompatibility = JavaVersion.VERSION_17
      targetCompatibility = JavaVersion.VERSION_17
    }
  }

  lint {
    abortOnError = false
  }
}

if (isStandalone) {
  kotlin {
    compilerOptions {
      jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
}
